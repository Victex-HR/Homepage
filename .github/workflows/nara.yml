name: NARA 입찰공고 수집·메일 발송

# nara/ 폴더(나라장터 입찰공고 화면)용 자동 실행.
# 매시간 nara/bot/nara.py tick 을 돌려 하루 한 번 공고를 갱신하고, 관리 화면에서 정한 일정에 엑셀 메일을 보낸다.
# 공고 데이터는 홈페이지 이력에 쌓이지 않도록 nara-data 브랜치에 덮어써서 올린다.

on:
  schedule:
    - cron: "7 * * * *"      # 매시 7분 (UTC). 발송 시각 판단은 nara.py 가 한국시간으로 함
  workflow_dispatch:
    inputs:
      force_update:
        description: "오늘 이미 갱신했어도 공고를 다시 수집"
        type: boolean
        default: false

concurrency:
  group: nara
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 이전 공고 데이터 가져오기
        run: |
          mkdir -p nara/data
          if git ls-remote --exit-code --heads origin nara-data >/dev/null; then
            git fetch --depth 1 origin nara-data
            git archive FETCH_HEAD | tar -x -C nara/data
          fi
          if [ "${{ inputs.force_update }}" = "true" ]; then rm -f nara/data/index.json; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5

      - name: 수집·발송
        id: tick
        working-directory: nara/bot
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}          # Supabase 설정 전 임시 수신자
          MAIL_TIME: ${{ vars.MAIL_TIME }}
          SITE_URL: https://victex-hr.github.io/Homepage/nara/
        run: python nara.py tick

      - name: 공고 데이터 올리기 (nara-data 브랜치)
        if: steps.tick.outputs.changed == 'true'
        run: |
          cd nara/data
          git init -q -b nara-data
          git config user.name "nara-bot"
          git config user.email "nara-bot@users.noreply.github.com"
          git add -A
          git commit -qm "공고 데이터 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nara-data
